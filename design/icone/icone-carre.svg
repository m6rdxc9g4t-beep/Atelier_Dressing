<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- atelier_Dressing : version simplifiée de l'icône (charte néon, carré arrondi seul) -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3126"/>
      <stop offset="1" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="0.35" stop-color="#e6c79c"/>
      <stop offset="0.7" stop-color="#9c7643"/>
      <stop offset="1" stop-color="#e6c79c"/>
    </linearGradient>
    <linearGradient id="champagne" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4e2"/>
      <stop offset="0.5" stop-color="#e6c79c"/>
      <stop offset="1" stop-color="#a8824e"/>
    </linearGradient>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="flou"/>
      <feMerge><feMergeNode in="flou"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo-fin" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="flou"/>
      <feMerge><feMergeNode in="flou"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#fond)"/>
  <!-- cadre chromé lumineux -->
  <rect x="44" y="44" width="936" height="936" rx="196" fill="none" stroke="url(#chrome)" stroke-width="22" filter="url(#halo-fin)"/>
  <rect x="70" y="70" width="884" height="884" rx="174" fill="none" stroke="#e6c79c" stroke-opacity="0.25" stroke-width="4"/>
  <!-- cintre -->
  <g fill="none" stroke="url(#champagne)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#halo)">
    <path d="M512 452V404c0-30 24-50 52-50s52 22 52 50c0 24-16 40-38 46"/>
    <path d="M512 456L222 664c-18 13-10 38 12 38h556c22 0 30-25 12-38L512 456z"/>
  </g>
  <!-- étiquette suspendue -->
  <g filter="url(#halo-fin)">
    <path d="M512 702v58" stroke="#e6c79c" stroke-width="10" stroke-linecap="round"/>
    <rect x="462" y="756" width="100" height="62" rx="16" fill="url(#champagne)"/>
    <circle cx="512" cy="776" r="8" fill="#2a241c"/>
  </g>
  <!-- étincelles -->
  <path d="M770 250l14 38 38 14-38 14-14 38-14-38-38-14 38-14z" fill="#fff4e2" filter="url(#halo-fin)"/>
  <circle cx="210" cy="132" r="9" fill="#fff8ec"/>
  <circle cx="210" cy="132" r="26" fill="#fff8ec" opacity="0.18"/>
  <circle cx="862" cy="880" r="7" fill="#fff8ec"/>
</svg>
